# Paket yapılandırması.
#
# productName ESKİSİYLE BİREBİR AYNI kalmalı: kullanıcı tercihleri ve bildirim
# belirteci işletim sisteminin userData klasöründe uygulama adının altında
# duruyor. Ad değişse 1.1.0'dan gelen kullanıcı ayarlarını kaybeder ve bildirim
# belirtecini yeniden bağlamak zorunda kalırdı.
appId: com.ozgurtelli.finans
productName: Özgür Telli Finans
copyright: © Özgür Telli Fizyoterapi

directories:
  output: dagitim
  buildResources: varliklar

# Uygulamanın içine yalnızca gereken dosyalar girer.
files:
  - kaynak/**/*
  - varliklar/tepsi.png
  - package.json

# Dosya adları ASCII tutulur: Türkçe karakterli dosya adları indirme
# bağlantılarında ve bazı arşivleyicilerde bozuluyor.
artifactName: fzy-${os}-${arch}-${version}.${ext}

# Güncelleme beslemesi KENDİ SUNUCUMUZDA.
#
# GitHub deposu özel olduğu için "github" sağlayıcısı kullanılamaz: uygulamanın
# içine bir GitHub anahtarı gömmek gerekirdi ve o anahtar paketi açan herkese
# görünür olurdu. Bunun yerine iş akışı paketleri siteye yükler, uygulama
# güncellemeyi oradan alır. Depo özel kalır, güncelleme otomatik olur.
publish:
  provider: generic
  url: https://fzy.bogalab.com.tr/paket/
  channel: latest

win:
  target:
    - target: nsis
      arch: [x64]
  icon: varliklar/icon.ico
  # İmza yok: kullanıcı imzasız dağıtımı kabul etti. İlk kurulumda SmartScreen
  # "Daha fazla bilgi → Yine de çalıştır" adımı gerekir, sonraki açılışlarda çıkmaz.
  signAndEditExecutable: false

nsis:
  # oneClick kapalı: kullanıcı kurulum sihirbazını görsün, nereye kurulduğunu bilsin.
  oneClick: false
  # perMachine kapalı: yönetici izni İSTEMEZ. Klinik bilgisayarında yönetici
  # hesabı olmayabilir; kullanıcı klasörüne kurulum her durumda çalışır.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Özgür Telli Finans
  language: "1055"  # Türkçe
  # Kurulum bitince uygulama açılır; kaldırma sırasında ayarlar sorulmadan silinmez.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: varliklar/icon.icns
  category: public.app-category.finance
  darkModeSupport: true
  # UYGULAMA ADI macOS'ta ASCII OLMAK ZORUNDA.
  #
  # Paket adı "Özgür Telli Finans" olduğunda uygulama açılışta hiçbir şey
  # yazdırmadan SIGTRAP ile ölüyordu. Koşucuda tek değişkenli bir deneyle
  # kanıtlandı: aynı kod, aynı imza, aynı yetkilendirmeler, aynı asar —
  # yalnızca productName "FzyDeneme" yapıldığında uygulama sonuna kadar
  # açıldı (açılış izi 21 adımı tamamladı), Türkçe adla ölüyordu.
  #
  # Sebep: macOS dosya adlarını AYRIK (NFD) biçimde saklar, Info.plist ve
  # kod imzası ise BİRLEŞİK (NFC) biçimde tutar. Paket adı, içindeki
  # çalıştırılabilir dosya ve dört yardımcı uygulama ("… Helper",
  # "… Helper (GPU)", "… Helper (Plugin)", "… Helper (Renderer)") hep bu
  # addan türetildiği için Chromium yardımcı süreç yollarını bulamıyor.
  #
  # Veri dizini suçsuz: --user-data-dir ile ASCII bir yol verildiğinde de
  # ölüyordu. Tek örnek kilidi de suçsuz: kilitsiz çalıştırıldığında da
  # ölüyordu.
  #
  # Dosya sisteminde ASCII ad kullanılır, EKRANDA yine Türkçe ad görünür:
  # macOS menü çubuğunda ve Finder'da CFBundleDisplayName gösterilir.
  # Böylece kullanıcı hiçbir fark görmez. ASCII ada geçiş Paketle adımında
  # yalnızca macOS için yapılır (is akışındaki -c.productName); Windows
  # Türkçe adı korur, yoksa kurulu Windows uygulamalarının ayarları
  # (%APPDATA% altındaki klasör) yetim kalırdı.
  extendInfo:
    CFBundleDisplayName: Özgür Telli Finans
  # AD-HOC İMZA. Sertifika gerektirmez ama imzasız da değildir.
  #
  # Burada daha önce "identity: null" yazıyordu ve derleme "skipped macOS code
  # signing" diyerek paketi hiç imzalamıyordu. Sonuç: macOS uygulamayı
  # açmıyor, "hasar görmüş ve açılamıyor" diyordu. Sebep şu: Apple Silicon'da
  # imza ZORUNLU — çekirdek imzasız bir arm64 ikilisini çalıştırmıyor ve
  # macOS bu durumu bozuk dosya gibi bildiriyor. Sağ tık → Aç da kurtarmıyor,
  # çünkü sorun güvenilirlik değil, çalıştırılabilirlik.
  #
  # "-" kimliği codesign'ın ad-hoc imzası: Apple Developer hesabı ve sertifika
  # istemez, ikiliyi çalıştırılabilir kılar. Notarize edilmediği için Gatekeeper
  # yine uyarır, ama bu kez aşılabilir bir uyarı ("geliştirici doğrulanamadı")
  # ve sağ tık → Aç ile geçilir.
  identity: '-'
  # Hardened Runtime AÇIK + ad-hoc imza için gereken yetkilendirmeler.
  #
  # Önce "hardenedRuntime: false" denendi. O deneme de SIGTRAP verdi ve ben
  # bunu yetkilendirmelerin kalkmasına bağladım; SONRADAN YANLIŞ OLDUĞU
  # ANLAŞILDI — asıl sebep uygulama adındaki Türkçe harflerdi ve her iki
  # ayarda da ölüyordu. Yine de Hardened Runtime AÇIK bırakılıyor, çünkü
  # electron-builder JIT ve kütüphane yetkilerini ancak açıkken kendi
  # varsayılan listesinden veriyor. Derleme kaydındaki uyarı aslında
  # doğrudan çözümü söylüyordu: eksik olan şey disable-library-validation
  # yetkisiydi, Hardened Runtime değil.
  #
  # Yetkiler varliklar/entitlements.mac.plist içinde ve neden gerektikleri
  # orada tek tek açıklandı.
  hardenedRuntime: true
  entitlements: varliklar/entitlements.mac.plist
  entitlementsInherit: varliklar/entitlements.mac.plist

dmg:
  title: Özgür Telli Finans ${version}
