# Windows ve macOS paketlerini üretir ve sürüm sayfasına koyar.
#
# Neden GitHub üzerinde derleniyor: macOS paketi ancak gerçek bir Mac'te
# düzgün üretilebilir (ve imza alınacaksa yalnızca orada imzalanabilir).
# Barındırma sunucusu Linux, orada üretilen macOS paketi eksik kalıyor.
#
# Paketler neden "artifact" değil de RELEASE'e yükleniyor: hesabın çıktı
# depolama kotası dolu ("Artifact storage quota has been hit") ve kota 6-12
# saatte bir yeniden hesaplanıyor; derleme başarılı olup yükleme adımı
# tökezliyordu. Release varlıkları o kotaya girmez, üstelik sürümler
# tarayıcıdan indirilebilir bir sayfada toplanır.

name: Paketleri üret

on:
  # Sürüm etiketi atıldığında: git tag v2.0.1 && git push origin v2.0.1
  push:
    tags: ['v*']
  # Elle çalıştırmak için (Actions sekmesinden "Run workflow").
  # Etiket olmadığı için paket yüklenmez, yalnızca derlemenin sağlamlığı denenir.
  workflow_dispatch:

# Release oluşturup varlık yüklemek için gereken tek izin.
permissions:
  contents: write

jobs:
  derle:
    strategy:
      # fail-fast kapalı: Windows derlemesi hata verince macOS derlemesi de
      # iptal olurdu; biri çalışıyorsa en azından o paket elde kalsın.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: windows
            komut: --win
          - os: macos-latest
            ad: macos
            # productName macOS'ta ASCII'ye çevrilir. Türkçe adla paketlenen
            # uygulama açılışta SIGTRAP ile ölüyordu; sebebi ve kanıtı
            # electron-builder.yml'in mac bölümünde yazılı. Ekranda görünen
            # ad CFBundleDisplayName ile yine "Özgür Telli Finans".
            # Windows Türkçe adı korur: değiştirilse kurulu Windows
            # uygulamalarının %APPDATA% ayarları yetim kalırdı.
            komut: --mac -c.productName="Ozgur Telli Finans"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.ad }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json henüz yok (barındırma sunucusunda node kurulu değil,
      # orada üretilemedi). İlk derlemeden sonra çıkan kilit dosyası depoya
      # eklenirse burası "npm ci" ile sabitlenebilir.
      - name: Bağımlılıklar
        run: npm install

      # Yeniden deneme bilinçli: electron-builder derleme sırasında Electron
      # ikililerini ve yardımcı araçları ağdan indiriyor ve bu indirmelerden
      # biri HTTP 500 dönünce derleme tümden düşüyor (macOS'ta bir kez oldu,
      # aynı yapılandırma önceki koşuda sorunsuzdu). Geçici bir ağ hatasının
      # sürüm yayınını engellemesi için sebep yok.
      - name: Paketle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for deneme in 1 2 3; do
            echo "── paketleme denemesi $deneme"
            if npx electron-builder ${{ matrix.komut }} --publish never; then
              exit 0
            fi
            echo "deneme $deneme başarısız."
            [ "$deneme" -lt 3 ] && sleep 30
          done
          echo "Üç deneme de başarısız oldu." >&2
          exit 1

      # İmza DOĞRULANIR, varsayılmaz.
      #
      # 2.0.1'de derleme sorunsuz bitti ve çalıştırılamayan bir DMG üretti:
      # imzalama sessizce atlanmıştı. Derlemenin "başarılı" demesi paketin
      # açıldığı anlamına gelmiyordu. Bundan sonra imza yoksa derleme burada
      # durur ve bozuk paket hiç yayınlanmaz.
      - name: macOS imzasını doğrula
        if: matrix.ad == 'macos'
        shell: bash
        run: |
          bulundu=0
          for uyg in dagitim/mac*/*.app; do
            [ -d "$uyg" ] || continue
            bulundu=1
            echo "── $uyg"
            codesign --verify --deep --strict --verbose=2 "$uyg"
            codesign -dvv "$uyg" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier|Runtime' || true
            # Yetkilendirmeler GERCEKTEN uygulanmis mi: ad-hoc imzada
            # disable-library-validation yoksa uygulama acilmiyor.
            echo "   yetkilendirmeler:"
            codesign -d --entitlements :- "$uyg" 2>/dev/null | grep -oE 'com\.apple\.security\.cs\.[a-z-]+' | sed 's/^/     /' || echo "     (okunamadi)"
          done
          if [ "$bulundu" -eq 0 ]; then
            echo "Doğrulanacak .app bulunamadı." >&2
            exit 1
          fi

      # UYGULAMA GERÇEKTEN ÇALIŞTIRILIR.
      #
      # İki kez üst üste "başarılı" derleme hiç açılmayan paket üretti: önce
      # imzalama atlandığı için, sonra Hardened Runtime + ad-hoc imza
      # birleşimi yüzünden. İkisini de kullanıcı denediğinde öğrendik. İmza
      # doğrulaması bunların yalnızca birincisini yakalıyor; açılıp
      # açılmadığını ancak çalıştırmak gösterir.
      #
      # Koşucu arm64 olduğu için yalnızca arm64 paketi denenebilir; x64 paketi
      # Rosetta gerektirir ve koşucuda kurulu olmayabilir.
      # UYGULAMA GERÇEKTEN ÇALIŞTIRILIR.
      #
      # İki kez üst üste "başarılı" derleme hiç açılmayan paket üretti: önce
      # imzalama atlandığı için, sonra Hardened Runtime + ad-hoc imza
      # birleşimi yüzünden. İkisini de kullanıcı denediğinde öğrendik. İmza
      # doğrulaması bunların yalnızca birincisini yakalıyor; açılıp
      # açılmadığını ancak çalıştırmak gösterir.
      #
      # "timeout" KULLANILMIYOR: macOS'ta o komut yok (GNU coreutils'e ait,
      # koşucuda kurulu değil) ve adım uygulamayı hiç çalıştırmadan
      # "command not found" ile düşüyordu. Süre ölçümü arka plan süreci ve
      # kill -0 ile yapılıyor, her yerde çalışır.
      #
      # Koşucu arm64 olduğu için yalnızca arm64 paketi denenebilir; x64 paketi
      # Rosetta gerektirir ve koşucuda kurulu olmayabilir.
      # UYGULAMA GERÇEKTEN ÇALIŞTIRILIR ve çökerse macOS'un kendi çökme
      # raporu okunur.
      #
      # Neden karar kanıta bağlı: imzalama atlandığında paket açılmıyordu ve
      # bunu kullanıcı denediğinde öğrendik, o yüzden bu kapı gerekli. Ama
      # koşucuda Aqua (pencere sunucusu) oturumu yok; bir masaüstü uygulaması
      # bu yüzden de SIGTRAP ile düşebilir ve bu, paketin gerçek bir Mac'te
      # açılmayacağı anlamına GELMEZ. Çıkış kodu tek başına ikisini ayırt
      # etmiyor: her iki durumda da 133 geliyor.
      #
      # Bu yüzden ölçüt çıkış kodu değil, KANIT: uygulamanın çıktısında ya da
      # çökme raporunda kod imzası / kütüphane doğrulama izi varsa derleme
      # durur ve paket yayınlanmaz. İz yoksa uyarı düşülür ve yayın sürer;
      # belirsiz bir sinyalin sürümü süresiz bloke etmesi doğru değil.
      # UYGULAMA GERÇEKTEN ÇALIŞTIRILIR ve çökerse macOS'un kendi çökme
      # raporu okunur.
      #
      # Neden karar kanıta bağlı: imzalama atlandığında paket hiç açılmıyordu
      # ve bunu kullanıcı denediğinde öğrendik, o yüzden bu kapı gerekli. Ama
      # koşucuda Aqua (pencere sunucusu) oturumu yok; bir masaüstü uygulaması
      # bu yüzden de SIGTRAP ile düşebilir ve bu, paketin gerçek bir Mac'te
      # açılmayacağı anlamına GELMEZ. Çıkış kodu ikisini ayırt etmiyor:
      # her iki durumda da 133 geliyor.
      #
      # Bu yüzden ölçüt çıkış kodu değil KANIT: çıktıda ya da çökme raporunda
      # kod imzası izi varsa derleme durur; yoksa uyarı düşülür ve yayın sürer.
      #
      # Bu gövde üç sahte senaryoyla sınandı (ayakta kalan / SIGTRAP ile ölen /
      # imza hatası basan) ve üçünde de doğru karar verdiği doğrulandı.
      # macOS AÇILIŞ DENETİMİ — YAYINI DURDURUR.
      #
      # 2.0.1 ve 2.0.3'te derleme "başarılı" dedi ve hiç açılmayan paketler
      # yayınlandı; ikisini de kullanıcı keşfetti. Artık paket GERÇEKTEN
      # çalıştırılır ve açılmazsa iş burada durur.
      #
      # Açılıştaki sessiz ölümün sebebi uygulama adındaki Türkçe harflerdi;
      # koşucuda tek değişkenli deneyle bulundu (ayrıntısı
      # electron-builder.yml mac bölümünde). Bu adım o düzeltmenin yerinde
      # durduğunu her yayında yeniden ölçer.
      #
      # macOS'ta "timeout" komutu yok; sınır arka plana atıp beklemekle
      # konuyor. Önceki turda sınırsız çalıştırma yüzünden adım 45 dakika
      # takılmış ve hiçbir çıktı alınamamıştı.
      - name: macOS uygulamasını çalıştırarak doğrula
        if: matrix.ad == 'macos'
        shell: bash
        run: |
          set +e
          set +o pipefail

          uyg=$(find dagitim/mac-arm64 -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$uyg" ]; then
            echo "::error::arm64 uygulama paketi bulunamadı."
            find dagitim -maxdepth 2 | head -20
            exit 1
          fi
          ikili=$(find "$uyg/Contents/MacOS" -maxdepth 1 -type f | head -1)
          echo "paket: $uyg"
          echo "ikili: $ikili"
          echo "görünen ad: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$uyg/Contents/Info.plist" 2>/dev/null || echo '(yok)')"
          echo "paket adı : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$uyg/Contents/Info.plist" 2>/dev/null)"

          # Paket adının ASCII olduğunu doğrula: düzeltmenin sessizce geri
          # alınması en kolay şekilde buradan kaçardı.
          if printf '%s' "$(basename "$uyg")" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::Paket adı ASCII değil: $(basename "$uyg"). macOS'ta bu açılışta SIGTRAP'e yol açıyor."
            exit 1
          fi
          echo "✔ paket adı ASCII"

          echo "──────── uygulama çalıştırılıyor ────────"
          FZY_IZ=1 "$ikili" > acilis.log 2>&1 &
          pid=$!
          bekleme=0
          while [ "$bekleme" -lt 15 ]; do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
            bekleme=$((bekleme + 1))
          done

          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
            echo "✔ uygulama 15 saniye ayakta kaldı"
            echo "──── açılış izi ────"
            grep '^\[iz\]' acilis.log
            if ! grep -q '^\[iz\] açılış tamamlandı' acilis.log; then
              echo "::error::Uygulama ayakta ama açılış tamamlanmadı; iz yarıda kesildi."
              exit 1
            fi
            echo "✔ açılış izi sonuna kadar tamamlandı"
            exit 0
          fi

          wait "$pid"
          kod=$?
          echo "::error::Uygulama açılışta kapandı. Çıkış kodu: $kod"
          echo "──── açılış izi (kesildiği yer) ────"
          grep '^\[iz\]' acilis.log || echo "(iz yok)"
          echo "──── diğer çıktı ────"
          grep -v '^\[iz\]' acilis.log | tail -25
          echo "──── çökme raporu ────"
          sleep 5
          rapor=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"*.ips 2>/dev/null | head -1)
          if [ -n "$rapor" ]; then python3 araclar/ips-oku.py "$rapor"; else echo "(rapor yok)"; fi
          exit 1

      - name: Çıktıyı listele
        shell: bash
        run: ls -lh dagitim

      # Yalnızca etiketli derlemede yüklenir. Elle tetiklenen koşularda
      # etiket yoktur ve release'e yüklenecek bir sürüm de yoktur.
      - name: Sürüm sayfasına yükle
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIKET: ${{ github.ref_name }}
        run: |
          # Release'i iki iş de oluşturmaya çalışabilir; ikincisi "zaten var"
          # diyeceği için hata yutulur. --clobber yeniden denemelerde
          # "varlık zaten var" hatasını engeller.
          gh release create "$ETIKET" \
            --title "Özgür Telli Finans $ETIKET" \
            --notes "Windows kurulumu ve macOS DMG paketleri aşağıdadır. latest.yml otomatik güncelleme beslemesi içindir." \
            || echo "Release zaten var, yüklemeye geçiliyor."

          # latest.yml ve blockmap de yüklenir: otomatik güncelleme o
          # dosyaları okur, pakete eşlik etmezlerse güncelleme çalışmaz.
          # builder-debug.yml dışarıda bırakılır: electron-builder'ın hata
          # ayıklama dökümü, dağıtımda işi yok ve sunucuya da kopyalanıyordu.
          shopt -s nullglob
          dosyalar=()
          for d in dagitim/*.exe dagitim/*.dmg dagitim/*.yml dagitim/*.blockmap; do
            [ "$(basename "$d")" = "builder-debug.yml" ] && continue
            dosyalar+=("$d")
          done

          if [ ${#dosyalar[@]} -eq 0 ]; then
            echo "Yüklenecek dosya bulunamadı." >&2
            exit 1
          fi

          printf 'yükleniyor: %s\n' "${dosyalar[@]}"
          gh release upload "$ETIKET" "${dosyalar[@]}" --clobber

  yayinla:
    # Paketleri siteye kopyalar: otomatik güncelleme beslemesi orada duruyor.
    # Gerekli gizli anahtarlar tanımlı değilse sessizce atlanır — anahtar
    # yoksa iş başarısız görünmesin, paketler sürüm sayfasından indirilebilir.
    needs: derle
    # !cancelled() bilinçli: "needs" varsayılan olarak TÜM matris
    # bacaklarının başarılı olmasını bekliyor. macOS derlemesi geçici bir ağ
    # hatasıyla düştüğünde başarılı Windows paketi de siteye hiç gitmedi.
    # Eldeki paketler yayınlanmalı; eksik olan sonraki koşuda tamamlanır.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    name: siteye yükle

    steps:
      - name: Sürüm varlıklarını indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --dir paketler --repo "${{ github.repository }}"

      - name: Siteye kopyala
        shell: bash
        env:
          SUNUCU: ${{ secrets.SUNUCU_ADRES }}
          KULLANICI: ${{ secrets.SUNUCU_KULLANICI }}
          ANAHTAR: ${{ secrets.SUNUCU_SSH_ANAHTARI }}
          HEDEF: ${{ secrets.SUNUCU_HEDEF_DIZIN }}
          PORT: ${{ secrets.SUNUCU_PORT }}
        run: |
          if [ -z "$ANAHTAR" ] || [ -z "$SUNUCU" ]; then
            echo "SSH anahtarı tanımlı değil; yükleme atlandı."
            echo "Paketler sürüm sayfasından indirilebilir."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$ANAHTAR" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" -H "$SUNUCU" >> ~/.ssh/known_hosts 2>/dev/null

          ls -lh paketler
          scp -i ~/.ssh/id_ed25519 -P "${PORT:-22}" paketler/* "$KULLANICI@$SUNUCU:$HEDEF/"
          echo "Yüklendi: $HEDEF"
